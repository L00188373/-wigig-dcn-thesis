<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Hybrid Architecture: Congestion Relief Performance
  </text>
  <text x="500" y="60" font-size="14" text-anchor="middle" fill="#7f8c8d">
    Comparison of Pure Wired vs Hybrid (Wired + 60 GHz Wireless)
  </text>
  
  <!-- Y-axis label -->
  <text x="40" y="350" font-size="16" text-anchor="middle" transform="rotate(-90 40 350)" fill="#2c3e50">
    Throughput (Mbps)
  </text>
  
  <!-- Grid -->
  <line x1="120" y1="550" x2="880" y2="550" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="120" y1="450" x2="880" y2="450" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="120" y1="350" x2="880" y2="350" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="120" y1="250" x2="880" y2="250" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="120" y1="150" x2="880" y2="150" stroke="#ecf0f1" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="120" y1="100" x2="120" y2="550" stroke="#2c3e50" stroke-width="2"/>
  <line x1="120" y1="550" x2="880" y2="550" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="110" y="555" text-anchor="end" font-size="12" fill="#2c3e50">0</text>
  <text x="110" y="455" text-anchor="end" font-size="12" fill="#2c3e50">500</text>
  <text x="110" y="355" text-anchor="end" font-size="12" fill="#2c3e50">1000</text>
  <text x="110" y="255" text-anchor="end" font-size="12" fill="#2c3e50">1500</text>
  <text x="110" y="155" text-anchor="end" font-size="12" fill="#2c3e50">2000</text>
  <text x="110" y="105" text-anchor="end" font-size="12" fill="#2c3e50">2500</text>
  
  <!-- Bar 1: Cat6 Only -->
  <rect x="200" y="350" width="120" height="200" fill="#3498db" opacity="0.8"/>
  <text x="260" y="335" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">1,000</text>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#2c3e50">Mbps</text>
  <text x="260" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Cat6 Only</text>
  <text x="260" y="610" text-anchor="middle" font-size="11" fill="#7f8c8d">(Baseline)</text>
  
  <!-- Bar 2: 60 GHz Only (MCS 12) -->
  <rect x="400" y="163" width="120" height="387" fill="#9b59b6" opacity="0.8"/>
  <text x="460" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">1,877</text>
  <text x="460" y="133" text-anchor="middle" font-size="12" fill="#2c3e50">Mbps</text>
  <text x="460" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">60 GHz</text>
  <text x="460" y="610" text-anchor="middle" font-size="11" fill="#7f8c8d">(MCS 12, 70% loss)</text>
  
  <!-- Bar 3: Hybrid - Stacked -->
  <!-- Wired portion (100 Mbps) -->
  <rect x="600" y="510" width="120" height="40" fill="#3498db" opacity="0.8"/>
  <text x="660" y="533" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Wired</text>
  <text x="660" y="548" text-anchor="middle" font-size="10" fill="white">100 Mbps</text>
  
  <!-- Wireless portion (2000 Mbps) -->
  <rect x="600" y="110" width="120" height="400" fill="#27ae60" opacity="0.8"/>
  <text x="660" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Wireless</text>
  <text x="660" y="320" text-anchor="middle" font-size="10" fill="white">2,000 Mbps</text>
  
  <!-- Total label -->
  <text x="660" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">2,100</text>
  <text x="660" y="75" text-anchor="middle" font-size="12" fill="#27ae60">Mbps Total</text>
  <text x="660" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Hybrid</text>
  <text x="660" y="610" text-anchor="middle" font-size="11" fill="#7f8c8d">(Wired + Wireless)</text>
  
  <!-- Highlight star -->
  <text x="660" y="55" text-anchor="middle" font-size="20" fill="#f39c12">⭐</text>
  
  <!-- Performance indicators -->
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="white" font-weight="bold">1.0×</text>
  <text x="460" y="380" text-anchor="middle" font-size="11" fill="white" font-weight="bold">1.88×</text>
  <text x="660" y="380" text-anchor="middle" font-size="11" fill="white" font-weight="bold">2.1×</text>
  
  <!-- Comparison arrows -->
  <line x1="330" y1="325" x2="390" y2="325" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="315" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">+88%</text>
  
  <line x1="530" y1="290" x2="590" y2="290" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="280" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">+12%</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Key benefits box -->
  <rect x="120" y="620" width="760" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="500" y="640" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Hybrid Architecture Benefits</text>
  <text x="270" y="660" text-anchor="middle" font-size="11" fill="#27ae60">✓ 2.1× Total Capacity</text>
  <text x="500" y="660" text-anchor="middle" font-size="11" fill="#27ae60">✓ 0% Packet Loss</text>
  <text x="730" y="660" text-anchor="middle" font-size="11" fill="#27ae60">✓ Congestion Relief</text>
  
  <!-- Congestion indicator -->
  <text x="260" y="365" text-anchor="middle" font-size="9" fill="#e74c3c" font-weight="bold">CONGESTED</text>
</svg>
